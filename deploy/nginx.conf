# nginx site configuration for the Parhikutini static build.
#
# Replaces the stock /etc/nginx/nginx.conf in the `nginx-unprivileged` image:
# the worker runs as the unprivileged `nginx` user on port 8080, so every
# writable path lives under /tmp.
#
# The site is entirely static — no upstream, no PHP, no CGI — so this config
# only has to get caching, compression, MIME types and the security headers
# right. Headers mirror public/_headers (see deploy/security-headers.conf).

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The unprivileged image cannot write into /var/lib/nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Do not advertise the exact nginx version in responses or error pages.
    server_tokens off;

    # Text assets only. The DEM rasters are already-compressed binary GeoTIFFs
    # (~33 MB total); gzipping them would burn CPU for roughly nothing.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Baseline policy for everything. Locations below that add their own
        # Cache-Control must re-include this file (add_header is not inherited).
        include /etc/nginx/security-headers.conf;

        # `_headers` is a Netlify/Cloudflare Pages config file that Vite copies
        # through from public/. It is meaningless to nginx and should not be
        # served to visitors.
        location = /_headers {
            return 404;
        }

        # Vite emits content-hashed filenames here, so the bytes behind a given
        # URL never change and the assets can be cached indefinitely.
        # Cache-Control is set with add_header only, never together with the
        # `expires` directive: the two would each emit a Cache-Control header
        # and some CDNs mishandle the duplicate.
        location /assets/ {
            include /etc/nginx/security-headers.conf;

            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # DEM rasters. Filenames are stable (not content-hashed), so this is a
        # long cache rather than immutable: a replaced raster propagates within
        # a month. geotiff.js fetches each file whole, so repeat visits are the
        # main lever on egress.
        location /data/mde/ {
            include /etc/nginx/security-headers.conf;

            # nginx's mime.types has no .tif mapping; without this the rasters
            # go out as application/octet-stream.
            default_type image/tiff;

            add_header Cache-Control "public, max-age=2592000" always;
        }

        # Small JSON datasets (data/all.json). These change when the Python
        # pipeline is re-run, so make browsers revalidate instead of caching.
        location /data/ {
            include /etc/nginx/security-headers.conf;

            add_header Cache-Control "no-cache" always;
        }

        # HTML entry points: stable URLs whose contents change on every deploy.
        location / {
            include /etc/nginx/security-headers.conf;

            add_header Cache-Control "no-cache" always;

            autoindex off;
            try_files $uri $uri/ =404;
        }
    }
}
