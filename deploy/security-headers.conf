# Security response headers, kept in one file so it can be re-included in every
# location that declares its own add_header.
#
# Why a separate file: nginx's add_header is not inherited by a location that
# declares any add_header of its own. So `location /assets/` (which adds
# Cache-Control) would silently lose the CSP unless it re-includes this file.
#
# Canonical policy: public/_headers, which Netlify and Cloudflare Pages read
# natively. nginx does not, hence this mirror. Keep the two in sync.
# Reference: docs/security-headers.md
#
# `always` makes the headers apply to error responses too (4xx/5xx), which is
# what the `_headers` file does implicitly.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.maptiler.com; connect-src 'self' https://*.maptiler.com; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
