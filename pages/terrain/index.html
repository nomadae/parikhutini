<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Terrain from TIFF</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        #legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            min-width: 170px;
            display: none;
        }
        #legend.visible {
            display: block;
        }
        #legendTitle {
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            opacity: 0.8;
            margin-bottom: 6px;
        }
        #legendBar {
            height: 12px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 5px;
            font-size: 18px;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }

        #visual-controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            user-select: none;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .group-label {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .zoom-controls {
            display: flex;
            gap: 5px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 5px;
        }

        #moveNorth, #rotateNorth { grid-column: 2; grid-row: 1; }
        #moveWest, #rotateWest   { grid-column: 1; grid-row: 2; }
        #moveEast, #rotateEast   { grid-column: 3; grid-row: 2; }
        #moveSouth, #rotateSouth { grid-column: 2; grid-row: 3; }

        #visual-controls button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            font-size: 18px;
            transition: background 0.2s;
        }

        #visual-controls button:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        #visual-controls button:active {
            background: rgba(255, 255, 255, 0.6);
        }

    </style>
</head>
<body>
    <div id="info">3D Terrain Viewer</div>
    <div id="legend">
        <div id="legendTitle">Elevation</div>
        <div id="legendBar"></div>
        <div class="legend-labels">
            <span id="legendMin"></span>
            <span id="legendMax"></span>
        </div>
    </div>
    <div id="loading">Loading TIFF data and initializing 3D viewer...</div>
    <div id="controls">
        <label>DEM: <select id="demSelect"></select></label>
        <label>Palette: <select id="paletteSelect"></select></label>
        <label>Height Scale: <input type="range" id="heightScale" min="0.001" max="0.1" step="0.001" value="0.01"></label>
        <label>Wireframe: <input type="checkbox" id="wireframe"></label>
        <label>Lock Camera: <input type="checkbox" id="lockCamera"></label>
    </div>

    <div id="visual-controls">
        <div class="control-group">
            <span class="group-label">Zoom</span>
            <div class="zoom-controls">
                <button id="zoomIn">+</button>
                <button id="zoomOut">−</button>
            </div>
        </div>
        <div class="control-group">
            <span class="group-label">Pan</span>
            <div class="d-pad">
                <button id="moveNorth">▲</button>
                <button id="moveWest">◀</button>
                <button id="moveEast">▶</button>
                <button id="moveSouth">▼</button>
            </div>
        </div>
    </div>


    <script type="module" src="./app.js"></script>
</body>
</html>
