<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D del terreno · Parhikutini</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .info-title { font-weight: 600; }
        .back-link {
            align-self: flex-start;
            color: #7fe3ff;
            font-size: 12px;
            text-decoration: none;
            border-bottom: 1px dotted rgba(127, 227, 255, 0.6);
        }
        .back-link:hover { color: #b8efff; border-bottom-style: solid; }
        .back-link:focus-visible {
            outline: 2px solid #7fe3ff;
            outline-offset: 2px;
            border-radius: 3px;
        }
        #legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            min-width: 170px;
            display: none;
        }
        #legend.visible {
            display: block;
        }
        #legendTitle {
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            opacity: 0.8;
            margin-bottom: 6px;
        }
        #legendBar {
            height: 12px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 22px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.55;
            max-width: min(440px, 86vw);
            max-height: 80vh;
            overflow-y: auto;
        }
        #loading h2 {
            margin: 0 0 8px;
            font-size: 16px;
        }
        #loading p { margin: 0 0 10px; }
        #loading p:last-of-type { margin-bottom: 0; }
        #loading a { color: #7fe3ff; }
        #loading .loading-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }
        #loading .loading-actions a,
        #loading .loading-actions button {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            padding: 7px 11px;
            text-decoration: none;
        }
        #loading .loading-actions a:hover,
        #loading .loading-actions button:hover {
            background: rgba(255, 255, 255, 0.26);
        }
        #loading .loading-actions :focus-visible {
            outline: 2px solid #7fe3ff;
            outline-offset: 2px;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }

        #visual-controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            user-select: none;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .group-label {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .zoom-controls {
            display: flex;
            gap: 5px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 5px;
        }

        #moveNorth, #rotateNorth { grid-column: 2; grid-row: 1; }
        #moveWest, #rotateWest   { grid-column: 1; grid-row: 2; }
        #moveEast, #rotateEast   { grid-column: 3; grid-row: 2; }
        #moveSouth, #rotateSouth { grid-column: 2; grid-row: 3; }

        #visual-controls button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            font-size: 18px;
            transition: background 0.2s;
        }

        #visual-controls button:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        #visual-controls button:active {
            background: rgba(255, 255, 255, 0.6);
        }

    </style>
</head>
<body>
    <div id="info">
        <span class="info-title">Visor 3D del terreno</span>
        <a class="back-link" href="../../">&larr; Volver al mapa</a>
    </div>
    <div id="legend">
        <div id="legendTitle">Elevación</div>
        <div id="legendBar"></div>
        <div class="legend-labels">
            <span id="legendMin"></span>
            <span id="legendMax"></span>
        </div>
    </div>
    <div id="loading">Cargando el modelo digital de elevación e iniciando el visor 3D…</div>
    <div id="controls">
        <label>MDE: <select id="demSelect"></select></label>
        <label>Paleta: <select id="paletteSelect"></select></label>
        <label>Escala de altura: <input type="range" id="heightScale" min="0.001" max="0.1" step="0.001" value="0.01"></label>
        <label>Malla: <input type="checkbox" id="wireframe"></label>
        <label>Bloquear cámara: <input type="checkbox" id="lockCamera"></label>
    </div>

    <div id="visual-controls">
        <div class="control-group">
            <span class="group-label">Zoom</span>
            <div class="zoom-controls">
                <button id="zoomIn" aria-label="Acercar">+</button>
                <button id="zoomOut" aria-label="Alejar">−</button>
            </div>
        </div>
        <div class="control-group">
            <span class="group-label">Desplazar</span>
            <div class="d-pad">
                <button id="moveNorth" aria-label="Desplazar hacia el norte">▲</button>
                <button id="moveWest" aria-label="Desplazar hacia el oeste">◀</button>
                <button id="moveEast" aria-label="Desplazar hacia el este">▶</button>
                <button id="moveSouth" aria-label="Desplazar hacia el sur">▼</button>
            </div>
        </div>
    </div>


    <script type="module" src="./app.js"></script>
</body>
</html>
